<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <!-- All user-visible text (incl. aria-labels) is set by popup.js from
       UI_LABELS so language switching covers everything. -->

  <!-- ── Main View ─────────────────────────────────── -->
  <div id="p-main-view">

    <div id="p-header">
      <span id="p-dot" class="p-dot p-gray" role="img" aria-label="Status"></span>
      <span id="p-title">Claude Status</span>
      <div id="p-header-actions">
        <button id="p-lang-btn"></button>
        <button id="p-refresh-btn"></button>
        <button id="p-theme-btn"></button>
        <button id="p-settings-btn"></button>
      </div>
    </div>

    <div class="p-section" id="p-components-section">
      <div class="p-section-header">
        <span class="p-section-title" id="p-components-title"></span>
      </div>
      <div id="p-components"></div>
    </div>

    <div class="p-section" id="p-uptime-section">
      <div class="p-section-header">
        <span class="p-section-title" id="p-uptime-title"></span>
      </div>
      <div id="p-uptime-chart">
        <div id="p-uptime-bars" role="img"></div>
      </div>
    </div>

    <div class="p-section" id="p-incidents-section">
      <div class="p-section-header">
        <span class="p-section-title" id="p-active-title"></span>
        <span id="p-active-count" class="p-badge" style="display:none">0</span>
      </div>
      <div id="p-active-incidents" role="list"></div>
    </div>

    <div class="p-section" id="p-maintenance-section">
      <div class="p-section-header">
        <span class="p-section-title" id="p-maint-title"></span>
        <span id="p-maint-count" class="p-badge" style="display:none">0</span>
      </div>
      <div id="p-maintenance" role="list"></div>
    </div>

    <div class="p-section" id="p-history-section">
      <div class="p-section-header">
        <span class="p-section-title" id="p-history-title"></span>
      </div>
      <div id="p-history" role="list"></div>
      <div style="height:4px"></div>
    </div>

    <div id="p-footer">
      <span id="p-timestamp" role="status" aria-live="polite"></span>
      <a id="p-link" href="https://status.anthropic.com" target="_blank" rel="noopener"></a>
    </div>

  </div><!-- /#p-main-view -->

  <!-- ── Settings View ──────────────────────────────── -->
  <div id="p-settings-view">

    <div id="p-settings-header">
      <button id="p-settings-back"></button>
      <span id="p-settings-title"></span>
    </div>

    <div class="p-setting-row">
      <div class="p-setting-info">
        <div class="p-setting-label" id="p-label-theme"></div>
        <div class="p-setting-desc" id="p-desc-theme"></div>
      </div>
      <select id="p-setting-theme" class="p-select" aria-labelledby="p-label-theme">
        <option value="auto"></option>
        <option value="dark"></option>
        <option value="light"></option>
      </select>
    </div>

    <div class="p-setting-row">
      <div class="p-setting-info">
        <div class="p-setting-label" id="p-label-notify"></div>
        <div class="p-setting-desc" id="p-desc-notify"></div>
      </div>
      <label class="p-toggle" aria-labelledby="p-label-notify">
        <input type="checkbox" id="p-setting-notify">
        <span class="p-toggle-track"></span>
      </label>
    </div>

    <div class="p-setting-row">
      <div class="p-setting-info">
        <div class="p-setting-label" id="p-label-widget"></div>
        <div class="p-setting-desc" id="p-desc-widget"></div>
      </div>
      <label class="p-toggle" aria-labelledby="p-label-widget">
        <input type="checkbox" id="p-setting-widget">
        <span class="p-toggle-track"></span>
      </label>
    </div>

    <div class="p-setting-row">
      <div class="p-setting-info">
        <div class="p-setting-label" id="p-label-lang"></div>
      </div>
      <select id="p-setting-lang" class="p-select" aria-labelledby="p-label-lang">
        <option value="de">Deutsch</option>
        <option value="en">English</option>
      </select>
    </div>

    <div class="p-setting-row">
      <div class="p-setting-info">
        <div class="p-setting-label" id="p-label-interval"></div>
        <div class="p-setting-desc" id="p-desc-interval"></div>
      </div>
      <select id="p-setting-interval" class="p-select" aria-labelledby="p-label-interval">
        <option value="0.5">30s</option>
        <option value="1" selected>1m</option>
        <option value="2">2m</option>
        <option value="5">5m</option>
      </select>
    </div>

  </div><!-- /#p-settings-view -->

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
