name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v4.0.0 (created at the run''s commit if missing)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Lint & test
        run: |
          npm run lint
          npm test

      - name: Build & package
        run: npm run build -- --zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.zip \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            --notes "Attached: Firefox and Chrome ZIPs (AMO-compliant forward-slash paths). Full changelog: [CHANGES.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGES.md)."
